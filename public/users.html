<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios y permisos</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="users.css">
</head>
<body>

<header class="topbar-admin">
  <h1>👤 Usuarios y permisos</h1>
  <input type="checkbox" id="navToggle" class="nav-toggle-checkbox">
  <label for="navToggle" class="nav-toggle-btn">☰</label>
  <nav class="admin-nav">
    <a class="nav-link" href="admin.html" data-permiso="menu">🛠️ Menú</a>
    <a class="nav-link" href="settings.html" data-permiso="config">⚙️ Configuración</a>
    <a class="nav-link" href="sales.html" data-permiso="reportes">📊 Ventas</a>
    <a class="nav-link" href="dashboard.html" data-permiso="reportes">📈 Dashboard</a>
    <a class="nav-link" href="turnos.html" data-permiso="turnos">🧾 Turnos</a>
    <a class="nav-link" href="pedidos.html" data-permiso="historial">🔎 Historial</a>
    <a class="nav-link" href="pos.html" data-permiso="caja">🧾 Caja</a>
    <a class="nav-link nav-link-salir" href="#" id="botonSalir">🚪 Cerrar sesión</a>
  </nav>
</header>

<main class="contenedor-admin">

  <section class="tarjeta-form">
    <h2>Crear cuenta nueva</h2>
    <form id="formNuevoUsuario" class="form-producto">
      <div class="campo">
        <label for="nuevoUsuario">Usuario</label>
        <input type="text" id="nuevoUsuario" placeholder="ej: caja2" autocomplete="off" required>
      </div>
      <div class="campo">
        <label for="nuevaClave">Clave</label>
        <input type="text" id="nuevaClave" placeholder="mínimo 8 caracteres" autocomplete="off" required>
      </div>
      <div class="campo campo-ancho">
        <label for="plantilla">Partir de una plantilla</label>
        <select id="plantilla">
          <option value="">Personalizada (elijo yo)</option>
          <option value="cajero">Cajero: caja e historial</option>
          <option value="cocina">Cocina: solo el tablero de cocina</option>
          <option value="administrador">Administrador: todas las pantallas</option>
        </select>
      </div>
      <fieldset class="pantallas" id="casillasNuevo"></fieldset>
      <button type="submit" class="boton-agregar">Crear cuenta</button>
    </form>
    <p class="mensaje" id="mensajeForm"></p>
  </section>

  <section class="tarjeta-lista">
    <h2>Cuentas existentes</h2>
    <div id="listaUsuarios" class="lista-usuarios"></div>
  </section>

</main>

<script src="users.js"></script>
<script src="permisos-nav.js"></script>
</body>
</html>
