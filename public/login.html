<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-caja">
  <h1>🍔 Iniciar sesión</h1>
  <p class="login-sub">Sistema de pedidos</p>

  <form id="formLogin">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" autocomplete="username" required>

    <label for="clave">Clave</label>
    <input type="password" id="clave" autocomplete="current-password" required>

    <button type="submit" id="botonEntrar">Entrar</button>
    <p class="login-error" id="loginError"></p>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
