<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar Menú</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar-admin">
  <h1>🛠️ Administrar Menú</h1>
  <div>
    <a class="link-volver" href="users.html">👤 Usuarios</a>
    <a class="link-volver" href="settings.html">⚙️ Configuración</a>
    <a class="link-volver" href="sales.html">📊 Ventas</a>
    <a class="link-volver" href="pos.html">🧾 Caja</a>
    <a class="link-volver" href="kds.html">👨‍🍳 Cocina</a>
    <a class="link-volver" href="#" id="botonSalir">Cerrar sesión</a>
  </div>
</header>

<main class="contenedor-admin">

  <section class="tarjeta-form">
    <h2>Agregar producto nuevo</h2>
    <form id="formNuevo" class="form-producto">
      <div class="campo">
        <label for="nuevaCategoria">Categoría</label>
        <input list="listaCategorias" id="nuevaCategoria" name="category" placeholder="Ej: Hamburguesas" required>
        <datalist id="listaCategorias"></datalist>
      </div>
      <div class="campo">
        <label for="nuevoNombre">Nombre del producto</label>
        <input type="text" id="nuevoNombre" name="name" placeholder="Ej: Hamburguesa Especial" required>
      </div>
      <div class="campo">
        <label for="nuevoPrecio">Precio</label>
        <input type="number" id="nuevoPrecio" name="price" min="0" step="500" placeholder="Ej: 15000" required>
      </div>
      <div class="campo campo-ancho">
        <label for="nuevosIngredientes">Ingredientes (separados por coma, opcional)</label>
        <input type="text" id="nuevosIngredientes" name="ingredients" placeholder="Ej: Pan, Carne, Queso, Lechuga, Tomate, Cebolla">
      </div>
      <div class="campo">
        <label for="nuevaImagen">Foto o ícono (opcional)</label>
        <div class="campo-imagen">
          <div class="vista-imagen" id="vistaImagenNueva">Sin foto</div>
          <label class="boton-subir-chico" for="nuevaImagen">Elegir imagen</label>
          <input type="file" id="nuevaImagen" accept="image/*" hidden>
        </div>
      </div>
      <button type="submit" class="boton-agregar">Agregar Producto</button>
    </form>
    <p class="mensaje" id="mensajeForm"></p>
  </section>

  <section class="tarjeta-lista">
    <h2>Productos del menú</h2>
    <div id="listaProductos" class="lista-productos"></div>
  </section>

</main>

<script src="img-utils.js"></script>
<script src="admin.js"></script>
</body>
</html>
